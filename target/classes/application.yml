spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db?currentSchema=project
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: EcommerceHikariCP
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: project
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: true
  
  flyway:
    enabled: true
    default-schema: project
    schemas: project
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.springframework.orm.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
